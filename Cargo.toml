[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# move other shared deps here too (tokio, serde, futures, anyhow, lancedb, fastembed, ...)
# and use `dep = { workspace = true }` in each crate, so features stay unified

[profile.dev]
debug = "line-tables-only" # smaller debug info, faster linking

[profile.dev.package."*"] # all dependencies: optimized, no debug info
opt-level = 2
debug = false

[profile.release]
strip = true
lto = false        # no whole-program LTO for day-to-day builds
incremental = true # reuse work between release builds

[profile.dist] # only when publishing binaries
inherits = "release"
lto = true
codegen-units = 1
incremental = false
