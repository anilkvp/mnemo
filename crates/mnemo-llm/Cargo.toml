[package]
name = "mnemo-llm"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.5", features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tower = "0.5.3"
anyhow = "1.0.104"
futures = "0.3.34"
tokio-util = { version = "0.7.20", features = ["io"] }
tokio-stream = { version = "0.1.19", features = ["io-util"] }
